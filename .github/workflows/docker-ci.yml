name: Docker CI + Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository }}/seesix-ui:latest \
          -t ghcr.io/${{ github.repository }}/seesix-ui:${{ env.IMAGE_TAG }} .

      - name: Push Image
        run: |
          docker push ghcr.io/${{ github.repository }}/seesix-ui:latest
          docker push ghcr.io/${{ github.repository }}/seesix-ui:${{ env.IMAGE_TAG }}